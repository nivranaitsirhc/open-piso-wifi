name: Build and Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.TAG }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG="v${PKG_VER#v}"
          fi
          echo "Release tag: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure Git Tag Exists
        run: |
          TAG="${{ steps.vars.outputs.TAG }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG" || true
          fi

  build-release:
    name: Build ${{ matrix.arch }} Release
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
          - arch: arm64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JavaScript Dependencies
        run: |
          if [ -d "portal" ]; then
            cd portal && npm install
            cd ../daemon && npm install --ignore-scripts
          else
            cd pisowifi-portal && npm install
            cd ../pisowifi-daemon && npm install --ignore-scripts
          fi

      - name: Setup QEMU for Native Addon Containers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build Architecture-Specific Release Bundle
        run: node scripts/build-release.mjs "${{ needs.prepare-release.outputs.tag }}"
        env:
          DATABASE_URL: "file:./prisma/dev.db"
          RELEASE_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}

      - name: Upload Architecture Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/opw-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Upload Release Metadata
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: dist/version.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - build-release
    runs-on: ubuntu-latest

    steps:
      - name: Download Release Assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: OpenPisoWiFi ${{ needs.prepare-release.outputs.tag }}
          files: |
            dist/opw-linux-armv7.tar.gz
            dist/opw-linux-arm64.tar.gz
            dist/opw-linux-amd64.tar.gz
            dist/version.json
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

